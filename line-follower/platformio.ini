; ============================================================================
;  PlatformIO 工程配置  ——  用 VS Code 开发时使用
;
;  用法：
;    1. VS Code 安装扩展 "PlatformIO IDE"
;    2. 用 VS Code 打开 line-follower 这个文件夹
;    3. 点底部状态栏的 ✓ (Build)
;    4. 产物：.pio/build/bluepill_f103c8/firmware.hex  ->  交给 FlyMcu 烧录
;
;  说明：下面把源码目录指向 Core/Src、头文件目录指向 Core/Inc，
;        和 Keil 工程共用同一套代码，不需要复制任何文件。
; ============================================================================

[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8          ; STM32F103C8T6, 72MHz, 64KB Flash / 20KB RAM
framework = stm32cube            ; PlatformIO 会自动准备 HAL 和 stm32f1xx_hal_conf.h

; 串口监视器的波特率（和程序里 USART1 的 115200 对应）
monitor_speed = 115200

; 编译后自动把 firmware.elf 转成 firmware.hex，方便交给 FlyMcu 烧录
; （如果这个脚本出问题，最坏情况只是没有 hex，直接烧 firmware.bin 一样能用）
extra_scripts = post:tools/make_hex.py

; 想让自己写的代码显示更多警告，可以打开下面这行（HAL 库自身也会跟着报一些警告，正常）
; build_flags = -Wall
; 下载用 FlyMcu（串口 ISP），不经过 PlatformIO，
; 所以状态栏那个 "→ Upload" 按钮不用点。
; 如果你想以后换成 ST-Link 一键下载，把下面两行取消注释即可：
; upload_protocol = stlink
; debug_tool = stlink
